spring.application.name=glowuprizz-crm-admin
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway 마이그레이션으로만 관리한다. Hibernate는 검증만 한다.
# 두 프로세스(admin/public) 중 admin만 마이그레이션을 실행한다 (동시 실행 경합 방지).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 데모/과제 검증용 JWT 서명 키. 실제 운영이라면 환경변수/시크릿 매니저로 분리해야 한다.
jwt.secret=${JWT_SECRET:demo-only-secret-key-change-me-before-any-real-deployment-32bytes+}
jwt.expiration-minutes=60
