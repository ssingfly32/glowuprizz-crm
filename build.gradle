plugins {
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.sanghee'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'jacoco'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.compilerArgs << '-parameters'
	}

	tasks.withType(Test).configureEach {
		systemProperty 'file.encoding', 'UTF-8'
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
		}
	}

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
		finalizedBy jacocoTestReport
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = false
			csv.required = false
			html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
		}
	}

	jacoco {
		toolVersion = "0.8.14"
		reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
	}
}

// bootRun은 docker compose와 달리 .env를 자동으로 읽지 않는다. 셸에 직접 export하지
// 않아도 되도록, bootRun 실행 전에 루트 .env를 읽어 해당 JavaExec 프로세스의 환경변수로
// 주입한다 (README의 실행 절차가 셸 종류와 무관하게 그대로 동작하게 하기 위함).
def loadDotEnvInto = { task ->
	def envFile = rootProject.file('.env')
	if (!envFile.exists()) {
		return
	}
	envFile.readLines().each { line ->
		line = line.trim()
		if (line && !line.startsWith('#')) {
			def index = line.indexOf('=')
			if (index > 0) {
				task.environment(line.substring(0, index).trim(), line.substring(index + 1).trim())
			}
		}
	}
}

project(':admin-bootstrap') {
	apply plugin: 'org.springframework.boot'
	tasks.named('bootRun') { doFirst { loadDotEnvInto(it) } }
}

project(':public-bootstrap') {
	apply plugin: 'org.springframework.boot'
	tasks.named('bootRun') { doFirst { loadDotEnvInto(it) } }
}
